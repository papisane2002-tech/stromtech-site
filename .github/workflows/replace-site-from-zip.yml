name: Replace Stromtech site from ZIP

on:
  push:
    branches: [version-complete-v9]

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uploaded branch
        uses: actions/checkout@v4
        with:
          ref: version-complete-v9
          fetch-depth: 0
      - name: Validate and replace repository contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("stromtech-site-complet_v10.zip")
          if not archive.is_file():
              raise SystemExit("Archive ZIP introuvable.")
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Archive endommagée : {bad}")
              names = [n for n in z.namelist() if n and not n.endswith("/")]
              if not names:
                  raise SystemExit("Archive vide.")
              for info in z.infolist():
                  p = Path(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Chemin interdit : {info.filename}")
              for item in list(Path(".").iterdir()):
                  if item.name not in {".git", ".github"}:
                      shutil.rmtree(item) if item.is_dir() else item.unlink()
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  target = Path(info.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          archive.unlink(missing_ok=True)
          PY
      - name: Commit replacement on working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remplacer le site par la version complète v10"
          git push origin version-complete-v9
