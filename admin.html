<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="robots" content="noindex,nofollow">
<title>Administration | Stromtech</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="logo" href="index.html">strom<b>tech</b></a><nav class="links" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="index.html#services">Services</a><a href="studio.html">Studio design</a></nav><div class="bar"><button class="link" id="logout" type="button" style="background:none;border:0;cursor:pointer;font:500 1rem Figtree,sans-serif;color:#5a6280;text-decoration:underline">Déconnexion</button></div></div></header>
<main class="container">
 <div class="msg err" id="warn" role="alert" hidden style="margin-top:24px"></div>
 <div class="app">
  <aside class="threads" aria-label="Conversations clients">
   <label for="filter" style="font-weight:700;font-size:.95rem">Afficher</label>
   <select id="filter" style="width:100%;padding:11px;border:1.5px solid #c9cfe4;border-radius:12px;font:inherit;margin:6px 0 12px"><option value="all">Toutes</option><option value="open">En cours</option><option value="closed">Terminées</option></select>
   <ul id="list"></ul>
  </aside>
  <section class="pane">
   <div id="chatView" hidden>
    <div class="chat-head"><h2 id="chatTitle"></h2><button class="btn btn-line" id="toggleStatus" type="button" style="padding:9px 18px"></button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="send" id="send"><label for="body" style="position:absolute;left:-9999px">Ta réponse</label><textarea id="body" required placeholder="Écris ta réponse…"></textarea><button class="btn btn-blue" type="submit">Répondre</button></form>
   </div>
   <div id="emptyView" hidden><p class="empty">Aucune conversation pour l’instant. Les demandes des clients apparaîtront ici.</p></div>
  </section>
 </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script src="chat.js"></script><script>initMessaging("admin")</script></body></html>
